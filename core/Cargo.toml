[package]
name = "hg"
version = "0.1.0"
edition = "2021"
description = "HGhub 业务核心层（dx150 协议 / 媒体代理 / 下载引擎），NAPI 暴露给 ArkTS"

[lib]
name = "hg"
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.2", default-features = false, features = ["napi4", "async"] }
napi-derive-ohos = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
cbc = "0.1.2"

[build-dependencies]
napi-build-ohos = "1.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
